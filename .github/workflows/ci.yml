name: CI
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Valida YAMLs (compose, prometheus, etc.)
      - uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint
          strict: false

      # Validate supported Compose files with committed, non-secret examples.
      - name: Validate Compose files
        run: |
          docker compose --env-file domains/data-platform/.env.example -f domains/data-platform/docker-compose.yml config --quiet
          docker compose --env-file domains/data-platform/.env.example -f domains/data-platform/monitoring/docker-compose.monitoring.yml config --quiet
          AUTH_ENV_FILE=.env.auth.example docker compose --env-file infra/.env.auth.example -f infra/compose.auth.yml config --quiet
          docker compose --env-file infra/.env.apextools.example -f infra/compose.apextools.yml config --quiet

      # Lint Dockerfiles (Airflow/Superset)
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: infra/airflow/Dockerfile

      # Python: checa os pipelines da plataforma de dados
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install ruff pytest -r domains/pulse-invoice/api/requirements.txt
      - run: ruff check --select E4,E7,E9,F infra/keycloak/bootstrap_realm.py
      - run: >-
          PYTHONPATH=domains/pulse-invoice/api pytest -q
          domains/pulse-invoice/tests/test_auth.py
          domains/pulse-invoice/tests/test_archive.py
          domains/pulse-invoice/tests/test_layouts.py

      # Build do Airflow (garante que a imagem compila)
      - name: Build Airflow image
        run: docker build -t airflow-local:ci infra/airflow
