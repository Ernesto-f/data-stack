<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Apex Data Integration</title>

  <style>
    :root{
      --bg:#0b0f14;
      --card:#111824;
      --txt:#e7eefc;
      --muted:#97a6c0;
      --line:#203047;
      --btn:#2f7dff;
      --btn2:#1b2636;
      --err:#ff5c5c;
      --ok:#42d392;
      --shadow:0 18px 60px rgba(0,0,0,.45);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      color:var(--txt);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
    }

    .wrap{
      max-width:900px;
      margin:24px auto;
      padding:0 16px;
    }

    .mt{margin-top:12px}

    /* ---------------- top bar ---------------- */
    .topbar{
      display:flex;
      justify-content:flex-start;
      margin-bottom:6px;
    }

    .btn{
      background:var(--btn);
      border:0;
      color:white;
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
      font-weight:700;
    }

    .btn.secondary{
      background:var(--btn2);
      border:1px solid var(--line);
      color:var(--txt);
    }

    .btn.ghost{
      background:transparent;
      border:1px solid var(--line);
      color:var(--txt);
    }

    .btn:disabled{
      opacity:.7;
      cursor:not-allowed;
    }

    /* ---------------- brand area ---------------- */
    .brand{
      text-align:center;
      margin:26px 0 26px;
    }


    .brand img{
      width:200px;  
      max-width:80%;
      height:auto;
      margin-bottom:16px;
      display:block;
      margin-left:auto;
      margin-right:auto;
    }

    h1{
      font-size:22px;
      margin:0;
      font-weight:700;
      letter-spacing:.3px;
    }

    .sub{
      color:var(--muted);
      margin-top:6px;
      font-size:13px;
    }

    /* ---------------- card upload ---------------- */
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:16px;
      padding:20px;
      box-shadow:var(--shadow);
    }

    label{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin:0 0 6px;
    }

    input{
      width:100%;
      background:#0f1622;
      color:var(--txt);
      border:1px solid var(--line);
      border-radius:10px;
      padding:10px;
      outline:none;
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }

    .mt{margin-top:14px}

    /* ---------------- status ---------------- */
    .status{
      display:flex;
      gap:10px;
      align-items:center;
      margin-top:14px;
      color:var(--muted);
      font-size:13px;
    }

    .dot{
      width:10px;
      height:10px;
      border-radius:999px;
      background:#3a4b66;
    }

    .dot.busy{background:#ffd35a}
    .dot.ok{background:var(--ok)}
    .dot.err{background:var(--err)}

    pre{
      margin-top:14px;
      display:none;
      background:#0f1622;
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px;
      white-space:pre-wrap;
      word-break:break-word;
      font-family:ui-monospace,monospace;
      font-size:12px;
    }
  </style>
</head>

<body>

  <div class="wrap">

    <!-- voltar -->
    <div class="topbar">
      <button class="btn ghost" id="btnBack">← Voltar</button>
    </div>

    <!-- logo + título -->
    <div class="brand">
      <!-- coloque seu logo aqui -->
      <img src="./images/apexlogo.svg" alt="Apex Logo"/>

      <h1 style="font-size: 30px;">Apex</h1>
      <div><h1 style="font-size: 20px;">Data Integration</h1></div>
    </div>

    <!-- upload -->
    <div class="card">
      <div class="sub">
        Cole a <b>route_key</b> (chave) que você recebeu e envie o arquivo.
      </div>



      <label>route_key</label>
      <input id="route_key" placeholder="Ex: PRODUCTION_MICROEVENTS_A1B2C3D4" />

      <div class="mt">
        <label>Arquivo (.xlsx / .csv)</label>
        <input id="file" type="file" accept=".xlsx,.csv,.xlsm"/>
      </div>

      <div class="row mt">
        <button class="btn" id="btnUpload">Enviar</button>
        <button class="btn secondary" id="btnClear">Limpar</button>
      </div>

      <div class="status">
        <span class="dot idle" id="statusDot"></span>
        <span id="statusText">Aguardando...</span>
      </div>

      <pre id="response"></pre>
    </div>

  </div>

<!--ULTIMO ARQUIVO QUE FOi FEITO UPLOAD COM OPÇÃO DE DELETE-->
  <div class="wrap">

      <div class="mt">
      <div class="wrap"; style="text-align: center; font-size: large; font-weight: bold;"> ULTIMO ARQUIVO CARREGADO </div>
      <table>
        <thead>
          <tr>
            <th style="width:28%">Nome Arquivo</th>
            <th style="width:10%">Status</th>
            <th style="width:22%">Data</th>
            <th style="width:28%">Destino</th>
            <th class="nowrap" style="width:6%">Remover</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="listOut" class="out"></div>
    </div>

  </div>

  <script src="./upload.js"></script>

  <script>
    document.getElementById("btnBack")
      .addEventListener("click", () => window.history.back());

    function renderList(){
      const q = ($("q").value || "").toLowerCase().trim();
      const rows = $("rows");
      rows.innerHTML = "";

      const filtered = allRoutes.filter(r => {
        if (!q) return true;
        const s = `${r.route_key||""} ${r.dataset_id||""} ${formatDestino(r)} ${r.target_system||""}`.toLowerCase();
        return s.includes(q);
      });

      for (const r of filtered){
        const tr = document.createElement("tr");

        const dest = formatDestino(r);
        const isActive = Number(r.is_active) === 1;

        tr.innerHTML = `
          <td>
            <b>${r.route_key||""}</b><br>
            <span class="badge">${r.load_mode||""}</span>
          </td>

          <td>
            <span class="status ${isActive ? "active" : ""}">
              <span class="dot-sm"></span>
              ${isActive ? "Active" : "Desactive"}
            </span>
          </td>

          <td>
            <span class="badge">${r.dataset_id||""}</span>
          </td>

          <td>${dest}</td>
          <td class="nowrap">${r.target_system||""}</td>
          <td class="nowrap">
            <button class="icon-btn" title="Editar" data-edit="${r.route_key}">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 20h9"/>
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
              </svg>
            </button>
          </td>
        `;

        tr.querySelector('[data-edit]')?.addEventListener("click", async (ev) => {
          ev.stopPropagation();
          hideOut(listOut);

          const key = (r.route_key || "").trim();
          if (!key) return;

          // abre instantâneo
          fillForm(r);
          openModal("edit");

          // cache
          if (routeCache.has(key)){
            fillForm(routeCache.get(key));
            return;
          }

          // full em background
          try{
            const full = await fetchJson(`${API_BASE}/admin/routes/${encodeURIComponent(key)}`);
            routeCache.set(key, full);
            if (($("route_key").value || "").trim().toUpperCase() === key.toUpperCase()){
              fillForm(full);
            }
          }catch(e){
            showOut(listOut, e, false);
          }
        });

        rows.appendChild(tr);
    }
  }
  </script>
  


</body>
</html>
