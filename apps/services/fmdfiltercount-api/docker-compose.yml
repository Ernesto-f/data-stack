services:
  fmdfiltercount-api:
    image: datastack-fastapi:latest
    container_name: fmdfiltercount-api
    volumes:
      - .:/app
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8012:8000"
    expose:
      - "8012"
    env_file:
      - .env
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  internal:
