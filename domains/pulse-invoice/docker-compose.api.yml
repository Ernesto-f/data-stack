name: pulse-invoice

services:
  api:
    image: pulse-invoice-api:demo
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: pulse-invoice-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:18097:8000"
    volumes:
      - ../preprocessing/docetl/data/docetl-data/.docetl/pulse-invoice-api:/doclet-invoice:rw
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - warehouse
      - docetl
      - archive

networks:
  warehouse:
    external: true
    name: data-stack_internal
  docetl:
    external: true
    name: docetl_default
  archive:
    external: true
    name: pulse-archive_internal
