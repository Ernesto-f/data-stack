server {
    listen 80;
    listen [::]:80;
    server_name knowledge.izatacore.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name knowledge.izatacore.com;

    client_max_body_size 512m;
    ssl_certificate /etc/letsencrypt/live/knowledge.izatacore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/knowledge.izatacore.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /pulse-logo.png {
        auth_basic off;
        alias /srv/data-stack/domains/automation/branding/pulse-logo.png;
        default_type image/png;
        add_header Cache-Control no-cache;
    }

    location = /pulse-fav32.png {
        auth_basic off;
        alias /srv/data-stack/domains/data-platform/monitoring/grafana/branding/pulse-fav32.png;
        default_type image/png;
        add_header Cache-Control no-cache;
    }

    # Preserve the public HTTPS scheme for native WeKnora OIDC callbacks.
    location ^~ /api/v1/auth/oidc/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
