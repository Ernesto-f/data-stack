server {
    listen 80;
    listen [::]:80;
    server_name tracking.izatacore.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tracking.izatacore.com;

    ssl_certificate /etc/letsencrypt/live/tracking.izatacore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tracking.izatacore.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /_oauth2_auth_tracking {
        internal;
        auth_basic off;
        proxy_pass http://127.0.0.1:4180/oauth2/auth?allowed_groups=/pulse/home/tracking;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;
    }

    error_page 401 = @oauth2_signin;
    location @oauth2_signin {
        auth_basic off;
        return 302 https://portal.izatacore.com/oauth2/start?rd=$scheme://$http_host$request_uri;
    }

    location = /pulse-logo.png {
        auth_request /_oauth2_auth_tracking;
        alias /srv/data-stack/domains/automation/branding/pulse-logo.png;
        default_type image/png;
        add_header Cache-Control no-cache;
    }

    location /api/socket {
        auth_request /_oauth2_auth_tracking;
        proxy_pass http://127.0.0.1:18092/api/socket;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        auth_request /_oauth2_auth_tracking;
        proxy_pass http://127.0.0.1:18092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
