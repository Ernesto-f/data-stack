server {
    listen 80;
    listen [::]:80;
    server_name nodered.izatacore.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://datalogger.izatacore.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nodered.izatacore.com;

    ssl_certificate /etc/letsencrypt/live/nodered.izatacore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nodered.izatacore.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://datalogger.izatacore.com$request_uri;
    }
}
