server {
    listen 80;
    listen [::]:80;
    server_name automation.izatacore.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name automation.izatacore.com;

    ssl_certificate /etc/letsencrypt/live/automation.izatacore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/automation.izatacore.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /airflow-branding.js {
        alias /srv/data-stack/domains/data-platform/nginx/airflow-branding.js;
        default_type application/javascript;
        add_header Cache-Control no-cache;
    }

    location = /pulse-logo.svg {
        alias /srv/data-stack/domains/data-platform/monitoring/grafana/branding/pulse-logo-dark.svg;
        default_type image/svg+xml;
    }

    location = /pulse-favicon.png {
        alias /srv/data-stack/domains/data-platform/monitoring/grafana/branding/pulse-fav32.png;
        default_type image/png;
    }

    location = /_oauth2_auth_automation {
        internal;
        auth_basic off;
        proxy_pass http://127.0.0.1:4180/oauth2/auth?allowed_groups=/pulse/home/airflow;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;
    }

    error_page 401 = @oauth2_signin;
    location @oauth2_signin {
        auth_basic off;
        return 302 https://portal.izatacore.com/oauth2/start?rd=$scheme://$http_host$request_uri;
    }

    location / {
        auth_request /_oauth2_auth_automation;
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        sub_filter_once off;
        sub_filter '<title>Airflow</title>' '<title>Pulse Automation</title>';
        sub_filter 'Welcome to Airflow' 'Pulse Automation';
        sub_filter 'Izatacore Pulse' 'Pulse Automation';
        sub_filter './static/pin_32.png' '/pulse-favicon.png';
        sub_filter '</head>' '<script defer src="/airflow-branding.js"></script></head>';
    }
}
