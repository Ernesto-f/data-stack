server {
    listen 80;
    listen [::]:80;
    server_name analytics.izatacore.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name analytics.izatacore.com;

    ssl_certificate /etc/letsencrypt/live/analytics.izatacore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analytics.izatacore.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /_oauth2_auth_analytics {
        internal;
        proxy_pass http://127.0.0.1:4180/oauth2/auth?allowed_groups=/pulse/home/analytics;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    }

    error_page 401 = @oauth2_signin;
    location @oauth2_signin {
        return 302 https://portal.izatacore.com/oauth2/start?rd=$scheme://$http_host$request_uri;
    }

    location / {
        auth_request /_oauth2_auth_analytics;
        error_page 403 =302 https://portal.izatacore.com/home/;
        proxy_pass http://127.0.0.1:13001;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        sub_filter_once off;
        sub_filter '<title>Grafana</title>' '<title>Pulse Analytics</title>';
        sub_filter 'Welcome to Grafana' 'Pulse Analytics';
        sub_filter 'Izatacore Pulse' 'Pulse Analytics';
        sub_filter '</head>' '<script>(function(){var title="Pulse Analytics";function brand(){if(document.title.indexOf("Grafana")!==-1)document.title=title;document.querySelectorAll("body *").forEach(function(e){var text=(e.textContent||"").trim();if(e.children.length===0&&(text==="Grafana"||text==="Welcome to Grafana"))e.textContent=title;if(e.getAttribute("aria-label")==="Grafana")e.setAttribute("aria-label",title);if(e.getAttribute("title")==="Grafana")e.setAttribute("title",title)});}brand();new MutationObserver(brand).observe(document.documentElement,{subtree:true,childList:true});})();</script></head>';
    }
}
