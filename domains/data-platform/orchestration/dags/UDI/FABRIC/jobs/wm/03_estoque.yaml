job_name: wm_specification_estoque
description: Estoque e valorizacao SAP

# Filtros e limites ficam explicitos aqui para o Airflow/job ser auditavel.
# use_config_filters=false evita duplicar os filtros globais do config.py.
use_config_filters: false
force_reload: false
so_ddl: false
where: ""

tabelas:
  - name: dbo.SAPECC_MARD
    limite: 200000
    where: "[WERKS] = 'BRAD'"
  - name: dbo.SAPECC_MCHB
    limite: 200000
    where: "[WERKS] = 'BRAD'"
  - name: dbo.SAPECC_MSKA
    limite: 200000
    where: "[WERKS] = 'BRAD'"
  - name: dbo.SAPECC_MBEW
    limite: 200000
    where: "[BWKEY] = 'BRAD'"

logs_dir: logs
status_dir: status/wm_specification_estoque
output_dir: output/wm_specification_estoque
