job_name: wm_specification_mestres_mat
description: Materiais mestres SAP

# Filtros e limites ficam explicitos aqui para o Airflow/job ser auditavel.
# use_config_filters=false evita duplicar os filtros globais do config.py.
use_config_filters: false
force_reload: false
so_ddl: false
where: ""

tabelas:
  - name: dbo.SAPECC_MARA
    limite: 1000000
    where: "MATNR IN (\n        SELECT MATNR\n        FROM dbo.SAPECC_AFPO\n        WHERE [DWERK] = 'BRAD'\n          AND AUFNR IN (\n              SELECT AUFNR\n              FROM dbo.sv_ecc_resb\n              WHERE [WERKS] = 'BRAD'\n                AND [BDTER] BETWEEN '20260101' AND '20261231'\n          )\n        UNION\n        SELECT MATNR\n        FROM dbo.sv_ecc_resb\n        WHERE [WERKS] = 'BRAD'\n          AND [BDTER] BETWEEN '20260101' AND '20261231'\n    )"
  - name: dbo.SAPECC_MAKT
    limite: 1000000
    where: "MATNR IN (\n        SELECT MATNR\n        FROM dbo.SAPECC_AFPO\n        WHERE [DWERK] = 'BRAD'\n          AND AUFNR IN (\n              SELECT AUFNR\n              FROM dbo.sv_ecc_resb\n              WHERE [WERKS] = 'BRAD'\n                AND [BDTER] BETWEEN '20260101' AND '20261231'\n          )\n        UNION\n        SELECT MATNR\n        FROM dbo.sv_ecc_resb\n        WHERE [WERKS] = 'BRAD'\n          AND [BDTER] BETWEEN '20260101' AND '20261231'\n    )"
  - name: dbo.SAPECC_MARC
    limite: 200000
    where: "[WERKS] = 'BRAD'"
  - name: dbo.SAPECC_MARM
    limite: 1000000
    where: "MATNR IN (\n        SELECT MATNR\n        FROM dbo.SAPECC_AFPO\n        WHERE [DWERK] = 'BRAD'\n          AND AUFNR IN (\n              SELECT AUFNR\n              FROM dbo.sv_ecc_resb\n              WHERE [WERKS] = 'BRAD'\n                AND [BDTER] BETWEEN '20260101' AND '20261231'\n          )\n        UNION\n        SELECT MATNR\n        FROM dbo.sv_ecc_resb\n        WHERE [WERKS] = 'BRAD'\n          AND [BDTER] BETWEEN '20260101' AND '20261231'\n    )"
  - name: dbo.vw_sapecc_t023t
    limite: 50000
    where: ""

logs_dir: logs
status_dir: status/wm_specification_mestres_mat
output_dir: output/wm_specification_mestres_mat
