name: pulse-archive-tenant-acl-test

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless-test-only
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U paperless -d paperless"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.20.14
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: db
      PAPERLESS_DBPORT: 5432
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: paperless-test-only
      PAPERLESS_SECRET_KEY: disposable-tenant-acl-test-secret-key
      PAPERLESS_URL: http://127.0.0.1:18995
      PAPERLESS_TIME_ZONE: UTC
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: disposable-admin-password
      PAPERLESS_ADMIN_MAIL: admin@example.invalid
      PAPERLESS_ACCOUNT_ALLOW_SIGNUPS: "false"
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_OCR_LANGUAGES: eng
      PAPERLESS_TASK_WORKERS: 1
    ports:
      - "127.0.0.1:18995:8000"
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - export:/usr/src/paperless/export
      - consume:/usr/src/paperless/consume
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

volumes:
  data:
  media:
  export:
  consume:
