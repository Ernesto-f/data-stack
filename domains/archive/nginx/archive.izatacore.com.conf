server {
    listen 80;
    listen [::]:80;
    server_name archive.izatacore.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name archive.izatacore.com;

    ssl_certificate /etc/letsencrypt/live/archive.izatacore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/archive.izatacore.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 512m;

    location = /pulse-logo.png {
        alias /srv/data-stack/domains/automation/branding/pulse-logo.png;
        default_type image/png;
        add_header Cache-Control no-cache;
    }

    location = /favicon.ico {
        auth_basic off;
        return 302 /pulse-fav32.png;
    }

    location = /pulse-fav32.png {
        alias /srv/data-stack/domains/data-platform/monitoring/grafana/branding/pulse-fav32.png;
        default_type image/png;
        add_header Cache-Control no-cache;
    }

    location / {
        proxy_pass http://127.0.0.1:18095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        sub_filter_once on;
        sub_filter "Paperless-ngx sign in" "Pulse Archive";
        sub_filter_types text/javascript;
        sub_filter 'A(0," Paperless-ngx ")' 'A(0," Pulse Archive ")';
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
