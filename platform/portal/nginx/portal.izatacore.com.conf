server {
    listen 80;
    listen [::]:80;
    server_name portal.izatacore.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name portal.izatacore.com;

    ssl_certificate /etc/letsencrypt/live/portal.izatacore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.izatacore.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/data-stack/platform/portal;
    index index.html;
    charset utf-8;
    add_header Cache-Control "no-cache" always;

    location = /pulse-logo.svg {
        auth_basic off;
        alias /srv/data-stack/domains/data-platform/monitoring/grafana/branding/pulse-logo-dark.svg;
        default_type image/svg+xml;
        add_header Cache-Control no-cache;
    }

    location = /pulse-icon.svg {
        auth_basic off;
        alias /srv/data-stack/domains/data-platform/monitoring/grafana/branding/pulse-icon.svg;
        default_type image/svg+xml;
        add_header Cache-Control no-cache;
    }

    location = /pulse-fav32.png {
        auth_basic off;
        alias /srv/data-stack/domains/data-platform/monitoring/grafana/branding/pulse-fav32.png;
        default_type image/png;
        add_header Cache-Control no-cache;
    }

    # Keycloak login endpoints are public OIDC endpoints; keep the admin UI private.
    location = /keylogin/admin {
        auth_basic off;
        return 404;
    }

    location ^~ /keylogin/admin/ {
        auth_basic off;
        return 404;
    }

    location ^~ /keylogin/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffering off;
    }

    # auth_request calls oauth2-proxy directly on loopback; never expose the
    # access-token-bearing auth endpoint as a browser-facing route.
    location = /oauth2/auth {
        auth_basic off;
        return 404;
    }

    location ^~ /oauth2/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
        proxy_buffering off;
    }

    location = /_oauth2_auth_portal {
        internal;
        auth_basic off;
        proxy_pass http://127.0.0.1:4180/oauth2/auth?allowed_groups=/pulse/home;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    location = /admin {
        auth_basic off;
        return 301 /admin/;
    }

    location ^~ /admin/ {
        auth_basic off;
        auth_request /_oauth2_auth_portal;
        try_files $uri $uri/ =404;
    }

    error_page 401 = @oauth2_signin;
    location @oauth2_signin {
        auth_basic off;
        return 302 https://portal.izatacore.com/oauth2/start?rd=$scheme://$http_host$request_uri;
    }

    # The upstream API accepts only a Keycloak access token derived from the
    # authenticated OAuth2 Proxy session; never forward a browser-supplied one.
    location ^~ /tenant-admin/api/ {
        auth_basic off;
        auth_request /_oauth2_auth_portal;
        auth_request_set $tenant_control_access_token $upstream_http_x_auth_request_access_token;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:18098/;
        proxy_http_version 1.1;
        proxy_set_header Authorization "Bearer $tenant_control_access_token";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffering off;
    }

    location ^~ /pulse-invoice/api/ {
        auth_basic off;
        auth_request /_oauth2_auth_portal;
        auth_request_set $pulse_invoice_access_token $upstream_http_x_auth_request_access_token;
        client_max_body_size 25m;
        proxy_pass http://127.0.0.1:18097/;
        proxy_http_version 1.1;
        proxy_set_header Authorization "Bearer $pulse_invoice_access_token";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffering off;
    }

    location / {
        auth_request /_oauth2_auth_portal;
        try_files $uri $uri/ =404;
    }
}
