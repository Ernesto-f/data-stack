# AQUI SERA CONFIGURADO MAIS UM LISTENER NO IP DAS TVS, PARA FAZER O REDIRECT. 
# TAMBEM SERA FEITO UM BLOQUEIO A NIVEL DE VM PRA NAO PERMITIR ACESSO DE OUTROS IPS A NAO SER O DAS TVS LIBERADAS
# IP QUE A VM VAi assumir na rede das TVs é o 192.168.230.200.

 server {
     listen 192.168.230.130:80;
     server_name _;
 
     location / {
      return 302 /analytics;
     }

     location /analytics {
         proxy_pass http://grafana:3000;

         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;

         proxy_set_header Upgrade $http_upgrade;
         proxy_set_header Connection $connection_upgrade;

         proxy_set_header Accept-Encoding "";
     }

     location /api/live/ {
         proxy_http_version 1.1;
         proxy_set_header Upgrade $http_upgrade;
         proxy_set_header Connection $connection_upgrade;
         proxy_set_header Host $host;
         proxy_pass http://grafana:3000;
     }
 }