load_module /usr/lib/nginx/modules/ngx_http_headers_more_filter_module.so;

worker_processes auto;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_max_body_size 10g;
  sendfile on;
  keepalive_timeout 65;
  ## Remove versao do nginx e banners
  server_tokens off;
  # remove do Nginx (resposta final)
  more_clear_headers Server;
  more_clear_headers X-Powered-By;

  # remove do backend (upstream)
  proxy_hide_header Server;
  proxy_hide_header X-Powered-By;

  # WebSocket (Grafana Live, etc.)
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ===== MAPEAMENTO DE GRUPOS DO KEYCLOAK PARA AIRFLOW =====
  # Lê os grupos extraídos pelo oauth2-proxy (via auth_request)
  #map $upstream_http_x_auth_request_groups $is_airflow_admin {
  #  default 0;
  #  ~*airflow-admin 1;
  #}

  #map $upstream_http_x_auth_request_groups $is_airflow_user {
  #  default 0;
  #  ~*airflow-user 1;
  #}

  #map $upstream_http_x_auth_request_groups $is_airflow_viewer {
  #  default 0;
  #  ~*airflow-viewer 1;
  #}

  # ===== FIM DO MAPEAMENTO =====

  include /etc/nginx/sites-enabled/*;
}
