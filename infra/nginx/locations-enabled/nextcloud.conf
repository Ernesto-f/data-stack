location = /cloud { return 301 /cloud/; }

location /cloud/ {
    proxy_pass http://172.20.0.31:8085/;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_set_header X-Forwarded-Prefix /cloud;


    proxy_redirect off;
    client_max_body_size 10g;

    proxy_request_buffering off;
    proxy_buffering off;

}

location = /.well-known/carddav { return 301 /cloud/remote.php/dav/; }
location = /.well-known/caldav  { return 301 /cloud/remote.php/dav/; }
