location / {
  auth_basic off;
  return 302 /home/;
  }

## Pulse Portal home
location = /_auth_pulse_home {
    internal;

    proxy_pass http://oauth2-proxy:4180/oauth2/auth?allowed_groups=/pulse/home;

    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Scheme $scheme;
    proxy_set_header X-Original-URI $request_uri;
}


#portal_home como site raiz
location /home/ {
    auth_basic off;
    
  auth_request /_auth_pulse_home;

  #auth_request /oauth2/auth;
  error_page 401 = @oauth2_signin;

  root /usr/share/nginx/apps/frontend/portal-home;
  index index.html;
  try_files $uri $uri/ /home/index.html;
}

#favicon para evitar erro feio se não existir
location = /favicon.ico {
  try_files /favicon.ico =204;
  access_log off;
  log_not_found off;
}


#portal_home como site raiz
location /novo/ {
    auth_basic off;
    
  auth_request /_auth_pulse_home;

  #auth_request /oauth2/auth;
  error_page 401 = @oauth2_signin;

  root /usr/share/nginx/apps/frontend/portal-home;
  index index_sso.html;
  try_files $uri $uri/ /home/index_sso.html;
}



