location /oauth2/ {
    proxy_pass http://oauth2-proxy:4180;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_set_header X-Auth-Request-Redirect $scheme://$host$request_uri;

    # OAuth2 Proxy pode retornar cookies/tokens grandes
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
}

location = /oauth2/auth {
    proxy_pass http://oauth2-proxy:4180/oauth2/auth;

    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-Uri $request_uri;
}

location @oauth2_signin {
    return 302 /oauth2/sign_in?rd=$scheme://$http_host$request_uri;
}

location = /oauth2/sign_out {
    proxy_pass http://oauth2-proxy:4180;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Scheme $scheme;

    proxy_set_header X-Auth-Request-Redirect "https://portal.izatacore.com/keylogin/realms/pulse/protocol/openid-connect/logout?id_token_hint={id_token}&post_logout_redirect_uri=$scheme://$host/home/";
}


location = /api/me {
    auth_request /oauth2/auth;

    auth_request_set $auth_user
        $upstream_http_x_auth_request_user;

    auth_request_set $auth_email
        $upstream_http_x_auth_request_email;

    auth_request_set $auth_groups
        $upstream_http_x_auth_request_groups;

    auth_request_set $auth_preferred_username
        $upstream_http_x_auth_request_preferred_username;

    error_page 401 = @oauth2_signin;

    default_type application/json;

    return 200 '{"user":"$auth_user","preferred_username":"$auth_preferred_username","email":"$auth_email","groups":"$auth_groups"}';
}
