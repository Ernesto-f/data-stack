# ============================================================
# API FILTER COUNT
# ============================================================

location = /fmdfiltercount/api {
    return 301 /fmdfiltercount/api/;
}

location /fmdfiltercount/api/ {
    proxy_pass http://fmdfiltercount:8000/;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Prefix /fmdfiltercount/api;

    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    proxy_next_upstream
        error
        timeout
        invalid_header
        http_500
        http_502
        http_503
        http_504;

    proxy_next_upstream_tries 1;

    proxy_intercept_errors on;

    error_page 502 503 504 = @fmdfiltercount_unavailable;

    proxy_redirect off;
}

# Resposta quando a API Filter Count estiver indisponível
location @fmdfiltercount_unavailable {
    default_type application/json;
    add_header Cache-Control "no-store" always;

    return 503 '{"status":"error","message":"fmdfiltercount API unavailable"}';
}