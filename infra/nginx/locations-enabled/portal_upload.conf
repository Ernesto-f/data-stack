location = /fileupload {
    return 301 /fileupload/;
}


#file upload user page
location ^~ /fileupload/ {
    alias /usr/share/nginx/apps/frontend/portal-fileupload/;
    index index.html;
    try_files $uri $uri/ /index.html;
}

location = /oauth2/auth-fileupload-admin {
  internal;

  proxy_pass http://oauth2-proxy:4180/oauth2/auth?allowed_groups=/pulse/home/fileupload/admin;

  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header X-Original-URI $request_uri;
}





#file upload admin page
location ^~ /fileupload/admin/ {
    
    #para pedir senha
    auth_request /oauth2/auth-fileupload-admin;

    # Se não estiver autenticado, inicia login no Keycloak
    #error_page 401 = @oauth2_cloudbeaver_login;
    error_page 403 =302 /home;

    alias /usr/share/nginx/apps/frontend/portal-fileupload/admin/;
    index index.html;
    try_files $uri $uri/ /fileupload/admin/index.html;
}

#API Routers
location /fileupload/api/ {
    proxy_pass http://fileupload-api:8000/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_redirect off;
}
