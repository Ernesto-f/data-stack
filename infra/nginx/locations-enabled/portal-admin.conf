# /admin -> /admin/
location = /admin {
    return 302 /admin/;
}


## Pulse Portal admin
location = /_auth_pulse_admin {
    internal;

    proxy_pass http://oauth2-proxy:4180/oauth2/auth?allowed_groups=/pulse/admin,/pulse/tenant-control-admin;

    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Scheme $scheme;
    proxy_set_header X-Original-URI $request_uri;
}


# Portal Admin protegido pelo Keycloak
location /admin/ {
    auth_basic off;

  auth_request /_auth_pulse_admin;

    #auth_request /oauth2/auth;
    #error_page 401 = @oauth2_signin;
    error_page 403 =302 /home;

    root /usr/share/nginx/apps/frontend/portal-home;
    index index.html;

    try_files $uri $uri/ /admin/index.html;
}
