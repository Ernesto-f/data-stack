location = /dataquery {
  return 301 /dataquery/;
}


location = /oauth2/auth-cloudbeaver {
  internal;

  proxy_pass http://oauth2-proxy:4180/oauth2/auth?allowed_groups=/pulse/home/cloudbeaver;

  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header X-Original-URI $request_uri;
}


location @oauth2_cloudbeaver_login {
  return 302 /oauth2/start?rd=$scheme://$host$request_uri;
}


location /dataquery/ {

    # Valida a sessão no oauth2-proxy
    auth_request /oauth2/auth-cloudbeaver;

    # Se não estiver autenticado, inicia login no Keycloak
    #error_page 401 = @oauth2_cloudbeaver_login;
    error_page 403 =302 /home;

    # Dados devolvidos pelo oauth2-proxy
    auth_request_set $auth_user
        $upstream_http_x_auth_request_preferred_username;

    auth_request_set $auth_email
        $upstream_http_x_auth_request_email;

    auth_request_set $auth_groups
        $upstream_http_x_auth_request_groups;

    # Headers que o CloudBeaver Reverse Proxy Auth espera
    proxy_set_header X-User $auth_user;

    # Por enquanto não envia Team até ajustarmos o delimitador dos grupos
    # proxy_set_header X-Team $auth_groups;

    # Opcional: manter email disponível para debug/outras integrações
    proxy_set_header X-Auth-Request-Email $auth_email;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_pass http://cloudbeaver:8978/dataquery/;
}
