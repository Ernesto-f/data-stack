

# Location para encurtar o link de acesso do PMD.
location = /analytics/pmd {
  auth_basic off;
  return 302 /analytics/d/apbfvrz/pmd-hub?orgId=2&from=now-6h&to=now&timezone=utc&kiosk=true;
}

# Location para direcionar correto se digitar sem o /.
location /analytics {
  auth_basic off;
  return 302 /analytics/;
}

location = /_oauth2_auth_analytics {
  internal;
  proxy_pass http://oauth2-proxy:4180/oauth2/auth?allowed_groups=/pulse/home/analytics;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
}

error_page 401 = @oauth2_signin;


# Location para o analytics PROMETHEUS.
location /analytics/ {
  auth_request /_oauth2_auth_analytics;
  error_page 403 =302 https://portal.izatacore.com/home/;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Prefix /analytics;
  proxy_set_header Accept-Encoding "";

  auth_basic off;

  proxy_pass http://grafana:3000;


  # Branding + JS injection
  # sub_filter_types text/html;
  sub_filter_once off;

  # title inicial (antes do JS carregar)
  sub_filter '<title>Grafana</title>' '<title>Pulse Analytics</title>';

  # Ativa filtro de substituição
  sub_filter 'Welcome to Grafana' 'Prometheus';

  # injeta 1 script que faz: title + texto do header
sub_filter '</head>' '<script>
(function () {
  var desiredTitle = "Pulse Analytics";
  var desiredBrand = "Pulse Analytics";
  var desiredWelcome = "Prometheus";

  function apply() {
    // title
    if (document.title !== desiredTitle) {
      document.title = desiredTitle;
    }

    // header/logo text
    var brandEl = document.querySelector("span.css-uantyg");
    if (brandEl && brandEl.textContent.trim() === "Grafana") {
      brandEl.textContent = desiredBrand;
    }

    // login welcome text
    var welcomeEls = document.querySelectorAll("h1");
    welcomeEls.forEach(function(el) {
      if (el.textContent && el.textContent.trim() === "Welcome to Grafana") {
        el.textContent = desiredWelcome;
      }
    });
  }

  apply();

  try {
    new MutationObserver(apply).observe(document.documentElement, {
      subtree: true,
      childList: true
    });
  } catch(e) {}

  setInterval(apply, 800);

  var _push = history.pushState;
  history.pushState = function() {
    _push.apply(this, arguments);
    setTimeout(apply, 0);
  };

  window.addEventListener("popstate", function() {
    setTimeout(apply, 0);
  });
})();
</script></head>';
}

# API GRAFANA.
   #Proxy Grafana Live WebSocket connections.
  location /api/live/ {
    auth_request /_oauth2_auth_analytics;
    error_page 403 =302 https://portal.izatacore.com/home/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_pass http://grafana:3000;
    proxy_set_header Accept-Encoding "";

  }
