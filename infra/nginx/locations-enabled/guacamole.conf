location = /remote {
    return 301 /remote/;
}
## =========================================================
## GUACAMOLE AUTH
## =========================================================

location = /_auth_guacamole {
    internal;

    proxy_pass http://oauth2-proxy:4180/oauth2/auth?allowed_groups=/pulse/home/guacamole;

    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Uri $request_uri;
}


## =========================================================
## GUACAMOLE
## =========================================================

location ^~ /remote/ {

    # Valida sessão no oauth2-proxy
    auth_request /_auth_guacamole;

    error_page 403 =302 /home;

    # Dados retornados pelo oauth2-proxy
    auth_request_set $auth_user
        $upstream_http_x_auth_request_preferred_username;

    auth_request_set $auth_email
        $upstream_http_x_auth_request_email;

    auth_request_set $auth_groups
        $upstream_http_x_auth_request_groups;

    proxy_set_header X-User $auth_user;

    proxy_set_header X-Email  $auth_email;
    proxy_set_header X-Groups $auth_groups;


    # -------------------------------------------------------
    # Backend Guacamole
    # -------------------------------------------------------

    proxy_pass http://guacamole:8080/;

    proxy_http_version 1.1;
    proxy_buffering off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
