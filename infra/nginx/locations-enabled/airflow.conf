location = /oauth2/auth-airflow {
  internal;

  proxy_pass http://oauth2-proxy:4180/oauth2/auth?allowed_groups=/pulse/home/airflow;

  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header X-Original-URI $request_uri;
}

location /airflow/ {

  #para pedir senha
  auth_basic off;
  auth_request /oauth2/auth-airflow;
  error_page 403 =302 /home;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Prefix /airflow;

  proxy_pass http://airflow-apiserver:8080;
}
