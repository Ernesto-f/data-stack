    <script>
        (function () {
            function hideLoader() {
                const loader = document.getElementById('app-loading-screen');
                if (!loader || loader.classList.contains('fade-out')) return;

                loader.classList.add('fade-out');

                setTimeout(function () {
                    if (loader && loader.parentNode) {
                        loader.parentNode.removeChild(loader);
                    }
                }, 700);
            }

            function appMounted() {
                const root =
                    document.getElementById('root') ||
                    document.getElementById('app') ||
                    document.querySelector('[id^="root"]');

                return !!(root && root.children && root.children.length > 0);
            }

            const observer = new MutationObserver(function () {
                if (appMounted()) {
                    hideLoader();
                    observer.disconnect();
                }
            });

            document.addEventListener('DOMContentLoaded', function () {
                if (appMounted()) {
                    hideLoader();
                } else {
                    observer.observe(document.body, {
                        childList: true,
                        subtree: true
                    });
                }
            });

            window.addEventListener('load', function () {
                setTimeout(hideLoader, 300);
            });
        })();
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const interval = setInterval(() => {
                const header = document.querySelector("header");

                if (header && !document.getElementById("pulse-title")) {
                    const title = document.createElement("div");
                    title.id = "pulse-title";
                    title.innerText = "Pulse - Data Query";

                    title.style.position = "absolute";
                    title.style.left = "50%";
                    title.style.top = "50%";
                    title.style.transform = "translate(-50%, -50%)";
                    title.style.fontSize = "18px";
                    title.style.fontWeight = "600";
                    title.style.color = "white";
                    title.style.pointerEvents = "none";
                    title.style.whiteSpace = "nowrap";
                    title.style.zIndex = "10";

                    if (getComputedStyle(header).position === "static") {
                        header.style.position = "relative";
                    }

                    header.appendChild(title);
                    clearInterval(interval);
                }
            }, 500);

            setTimeout(() => clearInterval(interval), 15000);
        });
    </script>
