
name: authentication

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"


networks:
  auth-edge:
    external: true
    name: infra-auth-edge

  apextools-edge:
    external: true
    name: infra-apextools-edge

  datastack-edge:
    external: true
    name: infra-datastack-edge

  apiapps-edge:
    external: true
    name: infra-apiapps-edge

  auth-internal:
    driver: bridge

  keycloak:
    driver: bridge

  tenant-control-internal:
    driver: bridge


services:
  # ======================================================================================= #
  # ====================================            ======================================= #
  # ====================================   PROXY    ======================================= #
  # ====================================            ======================================= #
  # ======================================================================================= #


  nginx:
    image: datastack-nginx
    container_name: auth_nginx
    profiles:
      - nginx_proxyReverso
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      ## caminho para todos os sites
      - ./nginx/locations-enabled:/etc/nginx/locations-enabled:ro
      ## caminho dos apps (portal, upload file etc...)
      - /srv/data-stack/apps/frontend:/usr/share/nginx/apps/frontend:ro

    networks:
      - auth-edge
      - apextools-edge
      - datastack-edge
      - apiapps-edge
      - auth-internal




  # ======================================================================================= #
  # ========================  AUTENTICACAO UNICA - LOGIN  ================================= #
  # ======================================================================================= #

  keycloak-db:
    image: postgres:16
    pull_policy: never
    container_name: keycloak-db
    restart: unless-stopped
    env_file:
      - ${AUTH_ENV_FILE:-.env.auth}
    profiles:
      - "AUTENTICAÇÃO - keycloak"
      - tenant-control

    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}

    volumes:
      - ./volumes/keycloak_db:/var/lib/postgresql/data

    networks:
      - keycloak

  keycloak:
    image: datastack-keycloak
    container_name: keycloak
    pull_policy: never
    restart: unless-stopped

    env_file:
      - ${AUTH_ENV_FILE:-.env.auth}

    profiles:
      - "AUTENTICAÇÃO - keycloak"
      - tenant-control

    depends_on:
      - keycloak-db

    command: ["start"]

    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: https://portal.izatacore.com/keylogin
      KC_HOSTNAME_ADMIN: "http://localhost:${KEYCLOAK_PORT:-18083}/keylogin"
      KC_HOSTNAME_STRICT: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HTTP_RELATIVE_PATH: "/keylogin"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"

    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-18083}:8080"

    volumes:
      - ./keycloak/custom:/opt/keycloak/themes/pulse:ro

    networks:
      - keycloak
      - auth-internal


  # ======================================================================================= #
  # =================================  TOKEN OICD ========================================= #
  # ======================================================================================= #

  oauth2-proxy:
    image: pulse-auth:oauth2-proxy
    container_name: oauth2-proxy
    profiles:
      - OAUTH2 - TOKEN
    env_file:
      - ${AUTH_ENV_FILE:-.env.auth}

    restart: unless-stopped

    environment:
      OAUTH2_PROXY_PROVIDER: "keycloak-oidc"

      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"

      OAUTH2_PROXY_LOGIN_URL: "https://portal.izatacore.com/keylogin/realms/pulse/protocol/openid-connect/auth"

      OAUTH2_PROXY_REDEEM_URL: "http://keycloak:8080/keylogin/realms/pulse/protocol/openid-connect/token"
      OAUTH2_PROXY_OIDC_JWKS_URL: "http://keycloak:8080/keylogin/realms/pulse/protocol/openid-connect/certs"
      OAUTH2_PROXY_OIDC_ISSUER_URL: "https://portal.izatacore.com/keylogin/realms/pulse"

      OAUTH2_PROXY_CLIENT_ID: "${OAUTH2_PROXY_CLIENT_ID}"
      OAUTH2_PROXY_CLIENT_SECRET: "${OAUTH2_PROXY_CLIENT_SECRET}"

      OAUTH2_PROXY_WHITELIST_DOMAINS: ".izatacore.com"

      OAUTH2_PROXY_PROXY_PREFIX: "/oauth2"

      OAUTH2_PROXY_REDIRECT_URL: "https://portal.izatacore.com/oauth2/callback"

      OAUTH2_PROXY_UPSTREAMS: "static://200"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_TRUSTED_PROXY_IPS: "127.0.0.1/32"

      OAUTH2_PROXY_COOKIE_SECRET: "${OAUTH2_PROXY_COOKIE_SECRET}"
      OAUTH2_PROXY_COOKIE_SAMESITE: "lax"
      OAUTH2_PROXY_COOKIE_PATH: "/"
      OAUTH2_PROXY_COOKIE_EXPIRE: "8h"
      OAUTH2_PROXY_COOKIE_REFRESH: "4m"
      OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_DOMAINS: ".izatacore.com"

      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_SCOPE: "openid email profile groups"

      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"

      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"

      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "false"

    ports:
      - "127.0.0.1:${OAUTH2_PROXY_PORT:-4180}:4180"

    networks:
      - auth-internal

  tenant-control-db:
    image: postgres:16
    container_name: tenant-control-db
    profiles: [tenant-control]
    env_file:
      - ${TENANT_CONTROL_ENV_FILE:-.env.tenant-control}
    environment:
      POSTGRES_DB: ${TENANT_CONTROL_DB_NAME:?Set TENANT_CONTROL_DB_NAME in tenant-control .env}
      POSTGRES_USER: ${TENANT_CONTROL_DB_USER:?Set TENANT_CONTROL_DB_USER in tenant-control .env}
      POSTGRES_PASSWORD: ${TENANT_CONTROL_DB_PASSWORD:?Set TENANT_CONTROL_DB_PASSWORD in tenant-control .env}
    volumes:
      - ./volumes/tenant_control_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [tenant-control-internal]

  tenant-control-api:
    build:
      context: ../platform/tenant-control
      dockerfile: Dockerfile
    image: pulse-tenant-control:local
    container_name: tenant-control-api
    profiles: [tenant-control]
    env_file:
      - ${TENANT_CONTROL_ENV_FILE:-.env.tenant-control}
      - ${AUTH_ENV_FILE:-.env.auth}
    environment:
      DATABASE_URL: postgresql://${TENANT_CONTROL_DB_USER}:${TENANT_CONTROL_DB_PASSWORD}@tenant-control-db:5432/${TENANT_CONTROL_DB_NAME}
      OIDC_ISSUER_URL: https://portal.izatacore.com/keylogin/realms/pulse
      OIDC_JWKS_URL: http://keycloak:8080/keylogin/realms/pulse/protocol/openid-connect/certs
      OIDC_ALLOWED_AZP: pulse-oauth2-proxy
      KEYCLOAK_ADMIN_BASE: http://keycloak:8080/keylogin
      TENANT_CONTROL_CLIENT_ID: ${TENANT_CONTROL_CLIENT_ID:?Set TENANT_CONTROL_CLIENT_ID in .env.auth}
      TENANT_CONTROL_CLIENT_SECRET: ${TENANT_CONTROL_CLIENT_SECRET:?Set TENANT_CONTROL_CLIENT_SECRET in .env.auth}
    depends_on:
      tenant-control-db:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "127.0.0.1:${TENANT_CONTROL_PORT:-18098}:8000"
    restart: unless-stopped
    networks: [tenant-control-internal, keycloak]
